name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name sanity check (must match export_presets.cfg)"
        required: false
        default: "v0.4"

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot + export templates
        run: |
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p /tmp/godot $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          wget -q -O /tmp/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot/godot.zip').extractall('/tmp/godot')"
          mv /tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
          wget -q -O /tmp/godot/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot/templates.tpz').extractall('/tmp/godot/tpl')"
          cp -r /tmp/godot/tpl/templates/* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          godot --version

      - name: Configure Godot Android settings + CI debug keystore
        run: |
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"
          mkdir -p ~/.config/godot
          SETTINGS=~/.config/godot/editor_settings-4.7.tres
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          cat >> "$SETTINGS" <<EOF
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          grep "export/android" "$SETTINGS"

      - name: Import project (script parse check)
        run: godot --headless --import --path .

      - name: Headless gameplay test (bot run)
        run: |
          rm -f ~/.local/share/godot/app_userdata/Micro\ Survivors/save.cfg
          timeout 150 godot --headless --path . --quit-after 4000 -- autotest 2>&1 | tail -3
          test -f ~/.local/share/godot/app_userdata/Micro\ Survivors/save.cfg \
            || (echo "AUTOTEST FAIL: no save.cfg written" && exit 1)
          cat ~/.local/share/godot/app_userdata/Micro\ Survivors/save.cfg

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/microsurvivors.apk
          ls -lh build/microsurvivors.apk
          ${ANDROID_SDK_ROOT}/build-tools/35.0.1/apksigner verify build/microsurvivors.apk
          ${ANDROID_SDK_ROOT}/build-tools/35.0.1/aapt dump badging build/microsurvivors.apk | grep -E "^package"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsurvivors-apk
          path: build/microsurvivors.apk
          retention-days: 30
